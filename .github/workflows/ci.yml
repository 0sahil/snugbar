name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    # SnugBar targets macOS 27, so it needs the macOS 27 SDK to build and a macOS 27 host to run its tests. GitHub
    # names its macOS 27 image after the Xcode it carries (xcode-27, Apple silicon); macos-26 can't run the tests.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # build-app.sh uses the commit count as the build number.
          fetch-depth: 0

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build app bundle (ad-hoc signed)
        run: bash scripts/build-app.sh
